<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00a1b0" />
    <meta
      name="description"
      content="auditorIA — plataforma de auditoria de dados conversacional: conecte seus bancos, pergunte em português e transforme respostas em gráficos e dashboards auditáveis."
    />
    <title>auditorIA — auditoria de dados conversacional</title>

    <!-- Tipografia da marca: Inter (interface) + JetBrains Mono (SQL/código).
         `preconnect` reduz o custo do handshake; se a rede falhar, o
         fallback de fontes de sistema em index.css assume sem quebrar nada. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- Tema aplicado ANTES do primeiro paint (script bloqueante, de propósito).
         Sem isto o React só decide o tema depois de montar, e quem usa escuro
         leva um flash branco a cada carregamento — o erro clássico de
         implementação de dark mode. Mantido inline e minúsculo: vai junto do
         HTML, sem request extra. A fonte da verdade continua sendo o mesmo
         `localStorage.theme` que o ThemeProvider lê. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark =
            stored === 'dark' ? true
            : stored === 'light' ? false
            : stored === 'system' ? prefersDark
            : true; // sem preferência salva → dark-first
          var el = document.documentElement;
          el.classList.toggle('dark', isDark);
          // Faz scrollbars e controles nativos acompanharem o tema.
          el.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {
          /* localStorage bloqueado (modo privado): segue no tema padrão. */
        }
      })();
    </script>
    <script type="module">
      // React Grab — ferramenta de DEV (selecionar elementos e copiar o
      // contexto do componente React pra colar em IA). Só carrega em dev.
      //   instalado via: npm i -D react-grab
      // Atalho padrão mantido: segure Ctrl/⌘+C e solte sobre o elemento.
      if (import.meta.env.DEV) {
        import('react-grab').then(({ registerPlugin }) => {
          // Injeta a URL da página atual no início de TODO conteúdo copiado.
          registerPlugin({
            name: 'page-url',
            hooks: {
              transformCopyContent: async (content) =>
                `URL: ${window.location.href}\n\n${content}`,
            },
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
